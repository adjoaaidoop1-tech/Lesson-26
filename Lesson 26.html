<head>

    <title>Document</title>
    <style>
        body{
            background-color: cornflowerblue;
            font-family: 'Times New Roman', Times, serif;

        .fact_file {

        }

        }

</head>
<body>

    <div class="fact_file">
        <h2 class="animal_name">Mountain Cat</h2>
